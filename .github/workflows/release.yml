name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Static Export for Mobile
        run: npm run build:mobile
        env:
          MOBILE_EXPORT: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Stage Release Artifacts for All Architectures
        run: |
          mkdir -p dist
          APK_DIR="android/app/build/outputs/apk/release"

          # 1. Universal APK (Compatible with all Android devices)
          if [ -f "$APK_DIR/app-universal-release.apk" ]; then
            cp "$APK_DIR/app-universal-release.apk" dist/zenodeck-universal.apk
            cp "$APK_DIR/app-universal-release.apk" dist/zenodeck-${{ github.ref_name }}-universal.apk
            cp "$APK_DIR/app-universal-release.apk" dist/zenodeck.apk
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" dist/zenodeck-universal.apk
            cp "$APK_DIR/app-release.apk" dist/zenodeck-${{ github.ref_name }}-universal.apk
            cp "$APK_DIR/app-release.apk" dist/zenodeck.apk
          fi

          # 2. Modern 64-bit ARM Phones (arm64-v8a)
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" dist/zenodeck-${{ github.ref_name }}-arm64-v8a.apk
          fi

          # 3. 32-bit ARM Phones (armeabi-v7a)
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/zenodeck-${{ github.ref_name }}-armeabi-v7a.apk
          fi

          # 4. Tablets, Chromebooks & Emulators (x86_64)
          if [ -f "$APK_DIR/app-x86_64-release.apk" ]; then
            cp "$APK_DIR/app-x86_64-release.apk" dist/zenodeck-${{ github.ref_name }}-x86_64.apk
          fi

          # Release notes selection
          if [ -f "RELEASE_NOTES_${{ github.ref_name }}.md" ]; then
            cp "RELEASE_NOTES_${{ github.ref_name }}.md" dist/RELEASE_NOTES.md
          elif [ -f "RELEASE_NOTES_v3.6.6.md" ]; then
            cp "RELEASE_NOTES_v3.6.6.md" dist/RELEASE_NOTES.md
          else
            cp "RELEASE_NOTES_v3.0.0.md" dist/RELEASE_NOTES.md
          fi

          echo "Staged release artifacts:"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ZenoDeck ${{ github.ref_name }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
