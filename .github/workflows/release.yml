name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Static Export for Mobile
        run: npm run build:mobile
        env:
          MOBILE_EXPORT: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Stage Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/zenodeck.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/zenodeck-${{ github.ref_name }}.apk
          if [ -f "RELEASE_NOTES_${{ github.ref_name }}.md" ]; then
            cp "RELEASE_NOTES_${{ github.ref_name }}.md" dist/RELEASE_NOTES.md
          elif [ -f "RELEASE_NOTES_v3.4.6.md" ]; then
            cp "RELEASE_NOTES_v3.4.6.md" dist/RELEASE_NOTES.md
          elif [ -f "RELEASE_NOTES_v3.4.5.md" ]; then
            cp "RELEASE_NOTES_v3.4.5.md" dist/RELEASE_NOTES.md
          else
            cp "RELEASE_NOTES_v3.0.0.md" dist/RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZenoDeck ${{ github.ref_name }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/zenodeck.apk
            dist/zenodeck-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
